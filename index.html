function sourceConfig(id){let s=sources.find(s=>s.id===id),admin=state.role==='admin';showModal(s.name+' · 字段配置','<p class="small-note">配置的是接入字段清单。已有历史数据保留；真实导入需在 CSV 导入流程中完成字段映射。</p><div class="form-grid"><label>数据源名称<input id="sourceName" value="'+esc(s.name)+'" '+(!admin?'disabled':'')+' maxlength="60"></label><label>数据路径<select id="sourceMode" '+(!admin?'disabled':'')+'>'+['CSV','API','部分 API','开发接入'].map(m=>'<option '+(s.mode===m?'selected':'')+'>'+m+'</option>').join('')+'</select></label></div><label class="check-row"><input id="sourceEnabled" type="checkbox" '+(s.enabled?'checked':'')+' '+(!admin?'disabled':'')+'>启用此数据源（停用不删除历史记录）</label><h3 style="margin-top:20px">可用接入字段</h3><div class="mapping-grid">'+['month','platform','industry','region',...Object.keys(metrics)].map(k=>'<label class="check-row"><input type="checkbox" data-source-field="'+k+'" '+(s.fields.includes(k)?'checked':'')+' '+(!admin?'disabled':'')+'>'+esc(metrics[k]||({month:'月份',platform:'平台',industry:'行业',region:'区域'})[k])+'</label>').join('')+'</div><div class="dialog-actions"><button class="button" id="sourceClose">关闭</button>'+(admin?'<button class="button primary" id="saveSource">保存配置</button>':'')+'</div>',()=>{$('#sourceClose').onclick=()=>$('#modal').close();if(admin)$('#saveSource').onclick=()=>{let name=$('#sourceName').value.trim(),fields=$$('[data-source-field]:checked').map(x=>x.dataset.sourceField);if(!name||!fields.length){notify('请填写名称并至少选择一个字段');return}s.name=name;s.mode=$('#sourceMode').value;s.enabled=$('#sourceEnabled').checked;s.fields=fields;s.status=s.mode==='CSV'?'人工导入':'接入方案';$('#modal').close();render();notify('已保存数据源配置')}})}
function addSource(){if(!needAdmin())return;showModal('添加自定义数据源','<p class="small-note">可添加新的平台，随后通过 CSV 导入赋予数据；API 选项仅展示接入方案。</p><div class="form-grid"><label>数据源名称<input id="newSourceName" placeholder="如：展会活动月报" maxlength="60"></label><label>归属平台<input id="newSourcePlatform" placeholder="新平台名称，或已有平台" maxlength="20"></label><label>接入路径<select id="newSourceMode"><option>CSV</option><option>API</option><option>开发接入</option></select></label><label>业务类型<select id="newSourceType"><option>业务平台</option><option>媒体平台</option><option>网站分析</option></select></label></div><div id="newSourceError" role="alert"></div><div class="dialog-actions"><button class="button primary" id="confirmNewSource">创建数据源</button></div>',()=>{$('#confirmNewSource').onclick=()=>{let name=$('#newSourceName').value.trim(),platform=$('#newSourcePlatform').value.trim(),mode=$('#newSourceMode').value,type=$('#newSourceType').value;if(!name||!platform){$('#newSourceError').innerHTML='<div class="error">名称与归属平台均为必填。</div>';return}if(sources.some(s=>s.name===name)){$('#newSourceError').innerHTML='<div class="error">数据源名称已存在。</div>';return}if(!channels.some(c=>c.name===platform))channels.push({name:platform,initial:platform[0],type,mode,social:type==='媒体平台',capUV:type==='网站分析'||type==='业务平台'});sources.push({id:'custom'+Date.now(),name,platform,type,mode,status:mode==='CSV'?'人工导入':'接入方案',last:'尚无数据',enabled:true,fields:['month','platform','industry','region','views']});$('#modal').close();syncControls();render();notify('已创建数据源，请导入 CSV 添加数据')}})}
function csvParse(str){str=str.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quoted=false;for(let i=0;i<str.length;i++){let c=str[i];if(c==='"'){if(quoted&&str[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&str[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('引号未闭合，请检查 CSV 格式。');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);if(rows.length<2)throw Error('至少需要表头和一行数据。');let headers=rows.shift().map(x=>x.trim());if(headers.some(h=>!h)||new Set(headers).size!==headers.length)throw Error('表头不能为空或重复。');if(rows.some(r=>r.length!==headers.length))throw Error('部分行的列数与表头不一致。');return {headers,records:rows};}
const csvFields=['month','platform','industry','region','views','pv','uv','likes','comments','shares','newFollowers','unfollows','followers','contentCount','registrations','leads','opportunities','enrollments','attendees','cost'];
const aliases={month:['month','月份','日期'],platform:['platform','平台'],industry:['industry','行业'],region:['region','区域'],views:['views','浏览量','浏览/播放量','浏览播放量','播放量'],pv:['pv','PV'],uv:['uv','UV'],shares:['shares','分享次数','分享'],likes:['likes','点赞'],comments:['comments','评论'],newFollowers:['newFollowers','新增关注','新关注人数'],unfollows:['unfollows','取消关注','取消关注人数'],followers:['followers','累计粉丝'],contentCount:['contentCount','发布数','内容数'],registrations:['registrations','注册','新增注册'],leads:['leads','有效表单'],opportunities:['opportunities','商机','有效商机'],enrollments:['enrollments','培训报名'],attendees:['attendees','培训到课'],cost:['cost','营销成本']};
function openImport(){if(!needAdmin())return;showModal('导入外部数据 · CSV','<div class="upload-zone"><b>选择平台月报文件</b><p>支持 UTF-8 CSV · 最大 2 MB · 10,000 行</p><input type="file" id="csvFile" accept=".csv,text/csv" aria-label="选择 CSV 文件"></div><div class="dialog-actions"><button id="templateDownload" class="button">下载标准模板</button></div><div id="importArea"></div>',()=>{$('#templateDownload').onclick=()=>download('BI标准导入模板.csv',toCSV(csvFields,[]));$('#csvFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{if(file.size>2*1024*1024)throw Error('文件超过 2 MB。');let batch=csvParse(await file.text());if(batch.records.length>10000)throw Error('超过 10,000 行，请拆分文件。');importBatch={...batch,fileName:file.name};renderMapping()}catch(err){$('#importArea').innerHTML='<div class="error" role="alert">'+esc(err.message)+'</div>';importBatch=null}}})}
function renderMapping(){let b=importBatch;$('#importArea').innerHTML='<div class="success-note">已读取 '+esc(b.fileName)+' · '+b.records.length+' 行。请确认字段映射，校验通过后才能写入。</div><h3>字段映射</h3><div class="mapping-grid">'+csvFields.map(k=>{let match=b.headers.find(h=>(aliases[k]||[k]).includes(h));return '<label class="field-label">'+esc(metrics[k]||({month:'月份 *',platform:'平台 *',industry:'行业 *',region:'区域 *'})[k])+'<select data-map="'+k+'"><option value="">未提供</option>'+b.headers.map((h,i)=>'<option value="'+i+'" '+(h===match?'selected':'')+'>'+esc(h)+'</option>').join('')+'</select></label>'}).join('')+'</div><p class="small-note">必填：月份、平台、行业、区域、浏览/播放量。维度必须使用目录中的名称。选填指标未提供时视为未知；导入键为 月份＋平台＋行业＋区域。</p><label class="field-label" style="margin-top:15px">重复数据处理<select id="mergeMode"><option value="replace">覆盖相同维度记录（整行快照）</option><option value="reject">拒绝已有维度记录</option></select></label><p class="small-note" style="margin-top:7px">覆盖会整体替换该记录：未映射的选填字段保留为未知，不沿用旧值。演示后可点击“恢复演示样本”。</p><div id="validationResult"></div><div class="dialog-actions"><button class="button" id="validateImport">校验与预览</button><button class="button primary" id="confirmImport" disabled>确认导入</button><button class="button danger" id="restoreDemo">恢复演示样本</button></div>';
 $('#validateImport').onclick=validateImport;$('#confirmImport').onclick=confirmImport;$('#restoreDemo').onclick=()=>{data=[];generate();importedCount=0;$('#modal').close();render();notify('已恢复演示数据；自定义源配置保留')};$$('[data-map]').forEach(s=>s.onchange=()=>{b.validated=null;$('#confirmImport').disabled=true;$('#validationResult').innerHTML=''});$('#mergeMode').onchange=()=>{b.validated=null;$('#confirmImport').disabled=true;$('#validationResult').innerHTML=''};}
const recordKey=r=>[r.month,r.platform,r.industry,r.region].join('|');
function validateImport(){let b=importBatch,map=Object.fromEntries($$('[data-map]').map(e=>[e.dataset.map,e.value])),errors=[],mapped=Object.values(map).filter(v=>v!==''),seen=new Set(),existing=new Set(data.map(recordKey)),replace=$('#mergeMode').value==='replace',records=[],duplicates=0;
 if(new Set(mapped).size!==mapped.length)errors.push('一个原始字段不能同时映射到多个目标字段。');for(let k of ['month','platform','industry','region','views'])if(map[k]==='')errors.push('缺少必填映射：'+k);
 if(!errors.length)b.records.forEach((row,index)=>{let n=index+2,r={source:'CSV导入'};for(let k of csvFields){let value=map[k]===''?'':row[+map[k]].trim();if(['month','platform','industry','region'].includes(k))r[k]=value;else if(value==='')r[k]=null;else if(!/^\d+(\.\d+)?$/.test(value)||!Number.isFinite(+value)||+value>1e12)errors.push('第 '+n+' 行 '+k+' 必须是 0–1e12 的非负数字。');else if(k!=='cost'&&!Number.isInteger(+value))errors.push('第 '+n+' 行 '+k+' 计数必须是整数。');else r[k]=+value}
 if(!/^202[56]-(0[1-9]|1[0-2])$/.test(r.month))errors.push('第 '+n+' 行月份应为 2025-01 至 2026-12。');let c=channels.find(c=>c.name===r.platform),source=sources.find(s=>s.platform===r.platform&&s.enabled);if(!c||!source)errors.push('第 '+n+' 行平台无启用数据源，请先创建或启用。');if(!industries.includes(r.industry))errors.push('第 '+n+' 行行业不在目录内。');if(!regions.includes(r.region))errors.push('第 '+n+' 行区域不在目录内。');if(r.views===null)errors.push('第 '+n+' 行浏览/播放量不能为空。');
 for(let [small,big]of [['uv','pv'],['leads','registrations'],['opportunities','leads'],['enrollments','leads'],['attendees','enrollments']])if(r[small]!==null&&r[big]!==null&&r[small]>r[big])errors.push('第 '+n+' 行 '+small+' 不得大于 '+big+'。');
 if(c&&!c.capUV&&(r.uv!==null||r.pv!==null))errors.push('第 '+n+' 行平台不支持 UV/PV，请取消相应映射。');if(c&&!c.social&&['newFollowers','unfollows','followers'].some(k=>r[k]!==null))errors.push('第 '+n+' 行平台不支持关注指标，请取消对应映射。');
 let key=recordKey(r);if(seen.has(key))errors.push('第 '+n+' 行存在文件内重复维度键。');seen.add(key);if(existing.has(key)){duplicates++;if(!replace)errors.push('第 '+n+' 行维度键已存在，请选择覆盖或调整记录。')}records.push(r);
 });
 let el=$('#validationResult');if(errors.length){b.validated=null;$('#confirmImport').disabled=true;el.innerHTML='<div class="error" role="alert">校验未通过：'+errors.length+' 项问题。<br>'+errors.slice(0,12).map(esc).join('<br>')+(errors.length>12?'<br>其余问题请修复后重新校验。':'')+'</div>';return}
 b.validated=records;b.duplicates=duplicates;el.innerHTML='<div class="success-note">校验通过 · '+records.length+' 行 · '+duplicates+' 条将覆盖，'+(records.length-duplicates)+' 条新增。</div><div class="table-wrap"><table><thead><tr><th>月份</th><th>平台</th><th>行业</th><th>区域</th><th class="num">浏览/播放</th><th class="num">注册</th></tr></thead><tbody>'+records.slice(0,5).map(r=>'<tr><td>'+r.month+'</td><td>'+esc(r.platform)+'</td><td>'+esc(r.industry)+'</td><td>'+esc(r.region)+'</td><td class="num">'+fmt(r.views)+'</td><td class="num">'+(r.registrations===null?'—':fmt(r.registrations))+'</td></tr>').join('')+'</tbody></table></div><p class="small-note">预览前 5 行；导入仅写入当前浏览器内存，刷新后恢复。</p>';$('#confirmImport').disabled=false;
}
function confirmImport(){if(!needAdmin()||!importBatch?.validated)return;let b=importBatch,keys=new Set(b.validated.map(recordKey));data=data.filter(r=>!keys.has(recordKey(r))).concat(b.validated);importedCount++;for(let s of sources){let records=b.validated.filter(r=>r.platform===s.platform);if(records.length){s.last=records.map(r=>r.month).sort().at(-1)+' · CSV 导入';s.status='本地已导入'}}let count=b.validated.length;$('#modal').close();render();notify('已导入 '+count+' 条记录，看板统计已更新')}
function toCSV(headers,records){let quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';return '\uFEFF'+[headers.map(quote).join(','),...records.map(r=>headers.map(k=>quote(r[k])).join(','))].join('\r\n')}
function download(name,text){let blob=new Blob([text],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
$('#export').onclick=()=>{if(!roles[state.role].export){notify('当前角色已关闭导出权限');return}let headers=[...csvFields,'source'];if(!roles[state.role].finance)headers=headers.filter(k=>k!=='cost');if(state.role==='operator')headers=headers.filter(k=>!['registrations','leads','opportunities','enrollments','attendees','cost','uv','pv'].includes(k));download('岛津BI_'+roles[state.role].label+'_'+state.year+'_'+state.period+'.csv',toCSV(headers,rows()));notify('已导出当前筛选范围；应用角色行范围与字段权限')};
syncControls();render();
// 仅供 demo 验证，无真实身份或生产服务连接。
window.BIDemo={getState:()=>({...state}),getRows:()=>rows().map(r=>({...r})),getAggregate:()=>aggregate(rows()),getSources:()=>sources.map(s=>({...s})),getRoles:()=>structuredClone(roles),csvParse};
})();
